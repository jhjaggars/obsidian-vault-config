description: "structured-output — gemma4:12b-128k on remote ollama.jaggars.cc"

prompts:
  - file://prompts/system-user.json

providers:
  - id: ollama:chat:gemma4:12b-128k
    label: gemma4-12b-remote
    config:
      temperature: 0
      num_predict: 8096
      num_ctx: 32768
      think: false

tests:
  # Test 1: Wiki-link pipe escaping INSIDE tables
  - vars:
      system_prompt: |
        You are a vault automation agent that generates Obsidian-compatible markdown.
        IMPORTANT: When a wiki-link with a display alias appears inside a markdown table cell,
        the pipe character must be escaped as \| so it isn't parsed as a column separator.
        Example: [[jira/KEY\|KEY]] inside a table, but [[jira/KEY|KEY]] outside a table.
      user_message: |
        Create a markdown table of JIRA issues with columns Key, Summary, Status.
        Include these issues:
        - HCMSTRAT-285: "Implement etcd sharding" — In Progress
        - OCPBUGS-42156: "CI flakiness in HCP tests" — In Progress

        Use wiki-links for the Key column: [[jira/KEY\|KEY]]
    assert:
      - type: contains
        value: '[[jira/HCMSTRAT-285\|HCMSTRAT-285]]'
      - type: contains
        value: '[[jira/OCPBUGS-42156\|OCPBUGS-42156]]'
      - type: javascript
        value: |
          // Verify table structure: header row + separator + data rows
          const lines = output.split('\n').filter(l => l.trim().startsWith('|'));
          if (lines.length < 4) throw new Error(`Expected at least 4 table lines (header + sep + 2 data), got ${lines.length}`);
          const sepLine = lines.find(l => l.includes('---'));
          if (!sepLine) throw new Error('Missing table separator row (|---|)');
          return true;

  # Test 2: Wiki-link WITHOUT escaping outside tables
  - vars:
      system_prompt: |
        You are a vault automation agent that generates Obsidian-compatible markdown.
        When referencing JIRA issues in bullet lists (not tables), use wiki-links: [[jira/KEY|KEY]]
        The pipe does NOT need escaping outside of tables.
      user_message: |
        Create a bullet list of these JIRA issues:
        - HCMSTRAT-285: "Implement etcd sharding" — In Progress
        - OCPBUGS-42156: "CI flakiness in HCP tests" — In Progress

        Use wiki-links: [[jira/KEY|KEY]]
    assert:
      - type: javascript
        value: |
          // Should contain unescaped pipe in wiki-links (outside tables)
          const hasLink = output.includes('[[jira/HCMSTRAT-285|HCMSTRAT-285]]') ||
                         output.includes('[[jira/HCMSTRAT-285\\|HCMSTRAT-285]]');
          if (!hasLink) throw new Error('Missing wiki-link for HCMSTRAT-285');
          return true;

  # Test 3: Info callout format
  - vars:
      system_prompt: |
        You are a vault automation agent. When writing auto-generated sections,
        always include an info callout with the generation date in this exact format:
        > [!info] Auto-generated by <agent-name> on YYYY-MM-DD
      user_message: |
        Write an info callout for the project-tracker agent, dated 2026-05-07.
    assert:
      - type: contains
        value: "> [!info]"
      - type: contains
        value: "2026-05-07"
      - type: javascript
        value: |
          const match = output.match(/>\s*\[!info\]\s*Auto-(?:generated|updated)\s+(?:by\s+)?.*(?:on\s+)?2026-05-07/i);
          if (!match) throw new Error('Info callout does not match expected format: > [!info] Auto-generated by ... on YYYY-MM-DD');
          return true;

  # Test 4: Heading hierarchy — Meeting Prep uses #### for individual meetings
  - vars:
      system_prompt: |
        You are a project-tracker agent. When writing the Meeting Prep section,
        use ### for the section heading and #### for individual meeting subheadings.

        Format:
        ### Meeting Prep
        > [!info] Auto-generated...
        #### Meeting Title (Time)
        - bullet points
      user_message: |
        Write a Meeting Prep section with two meetings:
        1. Platform Team Standup at 10:00 AM
        2. Alex Jesse 1:1 at 2:00 PM

        For each, just write "No recent activity found" as the content.
    assert:
      - type: contains
        value: "### Meeting Prep"
      - type: javascript
        value: |
          const h4matches = output.match(/^####\s/gm) || [];
          if (h4matches.length < 2) throw new Error(`Expected 2 #### subheadings for meetings, found ${h4matches.length}`);
          return true;
      - type: not-contains
        value: "##### "

  # Test 5: Markdown table formatting
  - vars:
      system_prompt: |
        You generate properly formatted markdown tables with header rows,
        separator rows, and data rows. Use | for column separators.
      user_message: |
        Create a table with columns: PR, Title, Status
        Data:
        - hypershift#7849, "Add etcd partition key support", Open
        - hypershift#7850, "Fix cert-manager rotation", Draft
    assert:
      - type: javascript
        value: |
          const lines = output.split('\n').filter(l => l.trim().startsWith('|'));
          if (lines.length < 4) throw new Error(`Need header + sep + 2 data rows, got ${lines.length} table lines`);
          const hasSep = lines.some(l => /\|[\s-]+\|/.test(l));
          if (!hasSep) throw new Error('Missing separator row');
          const header = lines[0].toLowerCase();
          if (!header.includes('pr') || !header.includes('title') || !header.includes('status'))
            throw new Error('Header missing expected columns');
          return true;

  # Test 6: People wiki-links
  - vars:
      system_prompt: |
        You are a vault automation agent. When mentioning people by name,
        use wiki-links if their People page exists. The following People pages exist:
        - People/Alex Chen.md
        - People/Priya Patel.md
        - People/Sam Taylor.md

        For people without pages, still use [[Name]] to create an unresolved link.
      user_message: |
        Write a bullet list of recent activity:
        - Alex Chen discussed etcd sharding in #dev-hypershift
        - Dana Kim raised an alert about staging environment
        - Priya Patel posted about migration timeline

        Use wiki-links for people names.
    assert:
      - type: contains
        value: "[[Alex Chen]]"
      - type: contains
        value: "[[Priya Patel]]"
      - type: contains
        value: "[[Dana Kim]]"
